name: Build SM7435 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📁 Clone Devicetree Repo
        run: |
          rm -rf arch/arm64/boot/dts/vendor
          git clone https://github.com/itzovi/android_kernel_xiaomi_sm7435-devicetrees arch/arm64/boot/dts/vendor

      - name: 📁 Clone Kernel Modules Repo
        run: |
          git clone https://github.com/itzovi/android_kernel_xiaomi_sm7435-modules modules

      - name: 📦 Install Build Dependencies (Clang 18 + GCC 13)
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            gcc-13 g++-13 clang-18 lld-18 python3 curl git unzip cpio libelf-dev libtfm-dev libdw-dev

      - name: 🛠 Set up Clang 18 and GCC 13 paths
        run: |
          echo "TOOLCHAIN_DIR=/usr/lib/llvm-18/bin" >> $GITHUB_ENV
          echo "GCC_DIR=/usr/bin" >> $GITHUB_ENV

      - name: ⚙️ Compile Kernel (Verbose)
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=neel
          export KBUILD_BUILD_HOST=github
          export PATH=$TOOLCHAIN_DIR:$GCC_DIR:$PATH

          make O=out gki_defconfig
          make O=out scripts

          make -j$(nproc) O=out \
            CC=clang-18 \
            AR=llvm-ar-18 \
            NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 \
            OBJDUMP=llvm-objdump-18 \
            STRIP=llvm-strip-18 \
            LD=ld.lld-18 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 V=1 | tee build.log

      - name: Upload build log (if exists)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: 📦 Package with AnyKernel3
        if: success()
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp out/arch/arm64/boot/dts/vendor/*.dtb AnyKernel3/ || true
          cd AnyKernel3
          zip -r9 Garnet-Kernel.zip ./*

      - name: 🚀 Upload Kernel ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Garnet-Kernel
          path: AnyKernel3/Garnet-Kernel.zip
